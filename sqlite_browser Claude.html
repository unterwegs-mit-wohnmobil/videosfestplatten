<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQLite Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:         #0a0c10;
  --panel:      #111318;
  --panel2:     #181c24;
  --border:     #252a35;
  --border2:    #1e2330;
  --text:       #d4dae8;
  --muted:      #525c70;
  --muted2:     #3a4255;
  --accent:     #4d9eff;
  --accent-dim: #1e3a5f;
  --green:      #34d058;
  --orange:     #f0a84a;
  --red:        #f07070;
  --hover:      #13171f;
  --sel:        #0f1e35;
  --resize-w:   4px;
  --mono: 'Geist Mono', monospace;
  --sans: 'Geist', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; overflow: hidden; }

#app { display: flex; flex-direction: column; height: 100vh; }

/* topbar */
#topbar { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 46px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
#logo { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: -.2px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.vr { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }
#url-input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 11px; padding: 5px 10px; border-radius: 5px; outline: none; transition: border-color .15s; }
#url-input:focus { border-color: var(--accent); }
#url-input::placeholder { color: var(--muted2); }
.btn { font-family: var(--sans); font-size: 12px; font-weight: 500; padding: 5px 13px; border-radius: 5px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s, color .12s; flex-shrink: 0; }
.btn:hover { background: #1f2535; border-color: var(--accent); color: #fff; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #6aaeff; }
#file-input { display: none; }

/* subbar */
#subbar { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 36px; background: var(--panel2); border-bottom: 1px solid var(--border2); flex-shrink: 0; font-size: 12px; }
#table-tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
#table-tabs::-webkit-scrollbar { display: none; }
.tab { font-family: var(--mono); font-size: 11px; padding: 3px 10px; border-radius: 4px; border: 1px solid transparent; color: var(--muted); cursor: pointer; white-space: nowrap; transition: all .12s; }
.tab:hover { color: var(--text); background: var(--panel); }
.tab.active { color: var(--accent); background: var(--accent-dim); border-color: #1e3d6a; }
#subbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
#db-status { display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted2); }
.dot.green  { background: var(--green); }
.dot.orange { background: var(--orange); }
#row-info { font-family: var(--mono); font-size: 11px; color: var(--muted); }
#btn-clear { display: none; font-size: 11px; padding: 3px 8px; color: var(--muted); border-color: var(--border2); background: transparent; }
#btn-clear:hover { color: var(--red); border-color: var(--red); }

/* empty */
#empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--muted); padding: 40px; }
#empty .e-icon { font-size: 52px; opacity: .2; line-height: 1; }
#empty .e-title { font-size: 15px; font-weight: 500; color: var(--muted); }
#empty .e-sub { font-family: var(--mono); font-size: 11px; color: var(--muted2); text-align: center; line-height: 1.8; }
#empty .e-actions { display: flex; gap: 8px; margin-top: 4px; }

/* drop overlay */
#drop-overlay { display: none; position: fixed; inset: 0; background: rgba(10,12,16,.88); z-index: 200; align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
#drop-overlay.show { display: flex; }
#drop-overlay .drop-box { border: 2px dashed var(--accent); border-radius: 16px; padding: 48px 80px; display: flex; flex-direction: column; align-items: center; gap: 12px; background: rgba(77,158,255,.04); }

/* loading */
#loading { display: none; position: fixed; inset: 0; background: rgba(10,12,16,.7); z-index: 199; align-items: center; justify-content: center; }
#loading.show { display: flex; }
.spinner { width: 30px; height: 30px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .65s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* table */
#table-wrap { flex: 1; overflow: auto; display: none; position: relative; }
table { border-collapse: collapse; table-layout: fixed; width: max-content; min-width: 100%; }
thead { position: sticky; top: 0; z-index: 20; }

/* filter row */
tr.filter-row th { background: #0c111a; border-bottom: 1px solid var(--border2); padding: 4px 5px; position: relative; }
tr.filter-row th input { width: 100%; background: var(--bg); border: 1px solid var(--border2); color: var(--text); font-family: var(--mono); font-size: 11px; padding: 3px 7px; border-radius: 4px; outline: none; transition: border-color .12s; display: block; }
tr.filter-row th input:focus { border-color: var(--accent); background: #07080d; }
tr.filter-row th input::placeholder { color: var(--muted2); }

/* label row */
tr.label-row th {
  background: var(--panel2);
  border-bottom: 2px solid var(--border);
  padding: 6px 8px;
  text-align: left;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .6px;
  white-space: nowrap;
  user-select: none;
  position: relative;
  cursor: grab;
  overflow: visible;
}
tr.label-row th:hover { color: var(--text); }
tr.label-row th.sorted { color: var(--accent); }
tr.label-row th.dragging-col { opacity: .35; background: #0c111a; }
tr.label-row th.drag-over-left  { box-shadow: inset  3px 0 0 var(--accent); }
tr.label-row th.drag-over-right { box-shadow: inset -3px 0 0 var(--accent); }
.col-label { pointer-events: none; overflow: hidden; text-overflow: ellipsis; display: block; padding-right: 14px; }
.sort-icon { margin-left: 3px; font-size: 9px; opacity: .45; }
th.sorted .sort-icon { opacity: 1; }

/* resize handle */
.resizer { position: absolute; right: 0; top: 0; bottom: 0; width: var(--resize-w); cursor: col-resize; background: transparent; z-index: 5; transition: background .1s; pointer-events: all; }
.resizer:hover, .resizer.dragging { background: var(--accent); }

/* body */
tbody tr { border-bottom: 1px solid var(--border2); transition: background .08s; }
tbody tr:hover { background: var(--hover); }
tbody td { padding: 4px 8px; font-family: var(--mono); font-size: 11px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tbody td.type-int, tbody td.type-real { color: var(--accent); text-align: right; }
tbody td.type-null { color: var(--muted2); font-style: italic; }
tbody td mark { background: rgba(77,158,255,.22); color: var(--accent); border-radius: 2px; padding: 0 1px; }
tbody td.rownum { color: var(--muted2); text-align: right; font-size: 10px; user-select: none; padding-right: 10px; }
thead tr.filter-row th.rownum-th { background: #0c111a; }
thead tr.label-row th.rownum-th { color: var(--muted2); font-size: 10px; cursor: default; }
</style>
</head>
<body>
<div id="app">

  <div id="drop-overlay">
    <div class="drop-box">
      <div style="font-size:44px">🗄️</div>
      <div style="font-size:18px;font-weight:500;color:var(--accent)">SQLite-Datei hier ablegen</div>
      <div style="font-size:12px;opacity:.5;font-family:var(--mono)">.db · .sqlite · .sqlite3</div>
    </div>
  </div>

  <div id="loading"><div class="spinner"></div></div>

  <div id="topbar">
    <div id="logo">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="2" y="1" width="12" height="14" rx="2" stroke="#4d9eff" stroke-width="1.5"/>
        <line x1="5" y1="5" x2="11" y2="5" stroke="#4d9eff" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="5" y1="8" x2="11" y2="8" stroke="#4d9eff" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="5" y1="11" x2="8.5" y2="11" stroke="#4d9eff" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      SQLite Browser
    </div>
    <div class="vr"></div>
    <input id="url-input" type="text" placeholder="URL zur .db-Datei → Enter" />
    <button class="btn primary" id="btn-url">Laden</button>
    <div class="vr"></div>
    <button class="btn" id="btn-file">📁 Öffnen…</button>
    <input type="file" id="file-input" accept=".db,.sqlite,.sqlite3">
  </div>

  <div id="subbar">
    <div id="table-tabs"></div>
    <div id="subbar-right">
      <button class="btn" id="btn-clear">✕ Filter löschen</button>
      <span id="row-info"></span>
      <div id="db-status"><div class="dot" id="db-dot"></div><span id="db-label">Keine DB</span></div>
    </div>
  </div>

  <div id="empty">
    <div class="e-icon">🗄️</div>
    <div class="e-title">Keine Datenbank geladen</div>
    <div class="e-sub">Datei per Drag &amp; Drop ablegen<br>oder über „Öffnen" / URL laden</div>
    <div class="e-actions"><button class="btn" id="btn-file2">📁 Datei öffnen…</button></div>
  </div>

  <div id="table-wrap">
    <table id="main-table">
      <thead>
        <tr class="filter-row" id="filter-row"></tr>
        <tr class="label-row"  id="label-row"></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<script>
'use strict';

let SQL = null, db = null;
let tables   = [];
let curTable = null;
let columns  = [];        // [{name, type}]  — order is user-controlled
let colWidths = {};
let filters  = {};
let sortCol  = null, sortAsc = true;
let debTimer = null;
const MAX = 500;
const DEFAULT_W = 140;

// ── sql.js ────────────────────────────────────────────────────
initSqlJs({
  locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}`
}).then(s => { SQL = s; });

// ── load buffer ───────────────────────────────────────────────
function loadBuffer(buf, label) {
  try {
    if (db) db.close();
    db = new SQL.Database(new Uint8Array(buf));
    const res = db.exec(`SELECT name FROM sqlite_master WHERE type IN ('table','view') ORDER BY name`);
    tables = res[0] ? res[0].values.map(r => r[0]) : [];
    if (!tables.length) { setStatus('orange','Keine Tabellen gefunden'); return; }
    setStatus('green', label);
    buildTabs();
    selectTable(tables[0]);
    document.getElementById('empty').style.display      = 'none';
    document.getElementById('table-wrap').style.display = 'block';
  } catch(e) { setStatus('orange','Fehler: '+e.message); }
}

// ── tabs ──────────────────────────────────────────────────────
function buildTabs() {
  const el = document.getElementById('table-tabs');
  el.innerHTML = '';
  tables.forEach(t => {
    const d = document.createElement('div');
    d.className = 'tab' + (t === curTable ? ' active' : '');
    d.textContent = t;
    d.addEventListener('click', () => selectTable(t));
    el.appendChild(d);
  });
}

function selectTable(name) {
  curTable  = name;
  filters   = {};
  sortCol   = null;
  sortAsc   = true;
  colWidths = {};
  const pragma = db.exec(`PRAGMA table_info("${name}")`);
  columns = pragma[0] ? pragma[0].values.map(r => ({ name: r[1], type: r[2].toUpperCase() })) : [];
  buildTabs();
  buildHeader();
  query();
}

// ── type helper ───────────────────────────────────────────────
function typeClass(type) {
  return /INT|REAL|FLOAT|DOUBLE|NUMERIC|DECIMAL/.test(type) ? 'type-int' : '';
}

// ── build header ──────────────────────────────────────────────
function buildHeader() {
  const fr = document.getElementById('filter-row');
  const lr = document.getElementById('label-row');
  fr.innerHTML = '';
  lr.innerHTML = '';

  // row-number stub
  const fn = document.createElement('th'); fn.className = 'rownum-th'; fn.style.width = '42px'; fr.appendChild(fn);
  const ln = document.createElement('th'); ln.className = 'rownum-th'; ln.textContent = '#'; lr.appendChild(ln);

  columns.forEach((col, idx) => {
    const w = colWidths[col.name] || DEFAULT_W;

    // ── filter th ──
    const fth = document.createElement('th');
    fth.style.width = w + 'px';
    fth.dataset.col = col.name;
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.placeholder = '⌕ ' + col.name;
    inp.value = filters[col.name] || '';
    inp.addEventListener('input', () => { filters[col.name] = inp.value; updateClearBtn(); sched(); });
    fth.appendChild(inp);
    fr.appendChild(fth);

    // ── label th ──
    const lth = document.createElement('th');
    lth.style.width = w + 'px';
    lth.dataset.col = col.name;
    lth.dataset.idx = idx;
    if (sortCol === col.name) lth.classList.add('sorted');

    // label span
    const span = document.createElement('span');
    span.className = 'col-label';
    span.innerHTML = col.name + `<span class="sort-icon">${sortCol===col.name?(sortAsc?'▲':'▼'):'⇅'}</span>`;
    lth.appendChild(span);

    // sort on click (not on resizer, not during col-drag)
    lth.addEventListener('click', e => {
      if (e.target.classList.contains('resizer') || lth.classList.contains('dragging-col')) return;
      sortCol === col.name ? (sortAsc = !sortAsc) : (sortCol = col.name, sortAsc = true);
      buildHeader(); query();
    });

    // resize handle
    const handle = document.createElement('div');
    handle.className = 'resizer';
    handle.addEventListener('mousedown', e => { e.stopPropagation(); startResize(e, col.name); });
    lth.appendChild(handle);

    // ── column drag ──
    lth.draggable = true;

    lth.addEventListener('dragstart', e => {
      // prevent drag when mousedown was on resizer
      if (e.target !== lth && e.target.classList.contains('resizer')) { e.preventDefault(); return; }
      dragSrc = col.name;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', col.name);
      setTimeout(() => lth.classList.add('dragging-col'), 0);
    });

    lth.addEventListener('dragend', () => {
      lth.classList.remove('dragging-col');
      clearDropIndicators();
      dragSrc = null;
    });

    lth.addEventListener('dragover', e => {
      e.preventDefault();
      if (!dragSrc || dragSrc === col.name) return;
      e.dataTransfer.dropEffect = 'move';
      clearDropIndicators();
      const rect = lth.getBoundingClientRect();
      const mid  = rect.left + rect.width / 2;
      lth.classList.add(e.clientX < mid ? 'drag-over-left' : 'drag-over-right');
    });

    lth.addEventListener('dragleave', () => { lth.classList.remove('drag-over-left','drag-over-right'); });

    lth.addEventListener('drop', e => {
      e.preventDefault();
      if (!dragSrc || dragSrc === col.name) return;
      const rect     = lth.getBoundingClientRect();
      const mid      = rect.left + rect.width / 2;
      const before   = e.clientX < mid;
      const srcIdx   = columns.findIndex(c => c.name === dragSrc);
      const tgtIdx   = columns.findIndex(c => c.name === col.name);
      if (srcIdx < 0 || tgtIdx < 0) return;

      // remove src, insert at correct position
      const [moved] = columns.splice(srcIdx, 1);
      const newIdx  = columns.findIndex(c => c.name === col.name);
      columns.splice(before ? newIdx : newIdx + 1, 0, moved);

      clearDropIndicators();
      buildHeader();
      query();
    });

    lr.appendChild(lth);
  });
}

let dragSrc = null;
function clearDropIndicators() {
  document.querySelectorAll('.drag-over-left,.drag-over-right')
    .forEach(el => el.classList.remove('drag-over-left','drag-over-right'));
}

// ── column resize ─────────────────────────────────────────────
function startResize(e, colName) {
  e.preventDefault();
  const startX = e.clientX;
  const startW = colWidths[colName] || DEFAULT_W;
  const handle = e.target;
  handle.classList.add('dragging');

  function onMove(ev) {
    const w = Math.max(50, startW + ev.clientX - startX);
    colWidths[colName] = w;
    document.querySelectorAll(`th[data-col="${colName}"]`).forEach(th => th.style.width = w+'px');
    const idx = columns.findIndex(c => c.name === colName);
    if (idx >= 0) {
      document.querySelectorAll('#tbody tr').forEach(tr => {
        const td = tr.cells[idx + 1];
        if (td) td.style.width = w+'px';
      });
    }
  }
  function onUp() {
    handle.classList.remove('dragging');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

// ── query ─────────────────────────────────────────────────────
function query() {
  if (!db || !curTable) return;
  const conds = [], params = {};
  columns.forEach(col => {
    const v = (filters[col.name] || '').trim();
    if (v) { conds.push(`"${col.name}" LIKE $${col.name}`); params[`$${col.name}`] = '%'+v+'%'; }
  });
  const where = conds.length ? 'WHERE ' + conds.join(' AND ') : '';
  const order = sortCol ? `ORDER BY "${sortCol}" ${sortAsc?'ASC':'DESC'}` : '';
  const cols  = columns.map(c => `"${c.name}"`).join(', ');

  const cnt   = db.exec(`SELECT count(*) FROM "${curTable}" ${where}`, params);
  const total = cnt[0] ? cnt[0].values[0][0] : 0;
  const res   = db.exec(`SELECT ${cols} FROM "${curTable}" ${where} ${order} LIMIT ${MAX}`, params);
  renderRows(res[0] ? res[0].values : [], total);
}

function sched() { clearTimeout(debTimer); debTimer = setTimeout(query, 180); }

// ── render ────────────────────────────────────────────────────
function renderRows(rows, total) {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  rows.forEach((row, ri) => {
    const tr = document.createElement('tr');
    const rn = document.createElement('td');
    rn.className = 'rownum'; rn.textContent = ri + 1;
    tr.appendChild(rn);
    row.forEach((val, ci) => {
      const td  = document.createElement('td');
      const col = columns[ci];
      const w   = colWidths[col.name] || DEFAULT_W;
      td.style.width = w + 'px';
      if (val === null) {
        td.className = 'type-null'; td.textContent = 'NULL';
      } else {
        const tc = typeClass(col.type);
        if (tc) td.className = tc;
        const str = String(val);
        const fv  = (filters[col.name] || '').trim();
        td.innerHTML = fv ? hlite(str, fv) : '';
        if (!fv) td.textContent = str;
        td.title = str;
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  const ri = document.getElementById('row-info');
  if (total === 0) ri.textContent = 'Keine Treffer';
  else if (rows.length < total) ri.textContent = `${rows.length} / ${total.toLocaleString('de')} Zeilen`;
  else ri.textContent = `${total.toLocaleString('de')} Zeile${total!==1?'n':''}`;
}

function hlite(text, term) {
  const esc = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(esc, 'gi'), m => `<mark>${m}</mark>`);
}

// ── status / clear ────────────────────────────────────────────
function setStatus(c, label) {
  document.getElementById('db-dot').className    = 'dot ' + c;
  document.getElementById('db-label').textContent = label;
}
function updateClearBtn() {
  const any = Object.values(filters).some(v => v.trim());
  document.getElementById('btn-clear').style.display = any ? '' : 'none';
}
document.getElementById('btn-clear').addEventListener('click', () => {
  filters = {};
  document.querySelectorAll('#filter-row input').forEach(i => i.value = '');
  updateClearBtn(); query();
});

// ── file picker ───────────────────────────────────────────────
function openPicker() { document.getElementById('file-input').click(); }
document.getElementById('btn-file').addEventListener('click', openPicker);
document.getElementById('btn-file2').addEventListener('click', openPicker);
document.getElementById('file-input').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  showLoad(true);
  f.arrayBuffer().then(buf => { loadBuffer(buf, f.name); showLoad(false); });
  e.target.value = '';
});

// ── URL ───────────────────────────────────────────────────────
document.getElementById('btn-url').addEventListener('click', fetchUrl);
document.getElementById('url-input').addEventListener('keydown', e => { if (e.key==='Enter') fetchUrl(); });
function fetchUrl() {
  const url = document.getElementById('url-input').value.trim(); if (!url) return;
  showLoad(true);
  fetch(url)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(buf => { loadBuffer(buf, url.split('/').pop()); showLoad(false); })
    .catch(e  => { setStatus('orange','Fetch-Fehler: '+e.message); showLoad(false); });
}

// ── drag & drop file ──────────────────────────────────────────
const overlay = document.getElementById('drop-overlay');
let dragDepth = 0;
document.addEventListener('dragenter', e => {
  // only react to file drops, not column reorder
  if (!e.dataTransfer.types.includes('Files')) return;
  e.preventDefault(); dragDepth++; overlay.classList.add('show');
});
document.addEventListener('dragleave', () => {
  dragDepth--; if (dragDepth <= 0) { dragDepth = 0; overlay.classList.remove('show'); }
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; overlay.classList.remove('show');
  const f = e.dataTransfer.files[0]; if (!f) return;
  showLoad(true);
  f.arrayBuffer().then(buf => { loadBuffer(buf, f.name); showLoad(false); });
});

function showLoad(on) { document.getElementById('loading').classList.toggle('show', on); }
</script>
</body>
</html>
